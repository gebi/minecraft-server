#!/usr/sbin/nft -f
# Host firewall for mc1, loaded by nftables.service.
#
# Only manages its own table: tailscaled maintains its rules (ts-* chains) in the
# ip/ip6 filter tables, so never "flush ruleset" here.
# Re-loading this file atomically replaces table inet mc1_filter.

table inet mc1_filter
delete table inet mc1_filter

table inet mc1_filter {
	chain input {
		type filter hook input priority filter; policy accept;

		# replies to connections initiated by mc1 itself (eg. STUN for Geyser NetherNet,
		# which uses the bedrock port as source port)
		ct state established,related accept

		# no minecraft without tailscale: minecraft (java 25565, bedrock 19132)
		# and minecraft2 (java 25665, bedrock 19232) only via tailscale0.
		# bedrock ports on tcp: Geyser NetherNet built-in signaling (http)
		iifname "eth0" tcp dport { 25565, 25665, 19132, 19232 } counter drop
		iifname "eth0" udp dport { 19132, 19232 } counter drop
	}
}
